services:
  separator:
    build: ./separator
    restart: unless-stopped
    # If memory ever runs out, only this container is killed instead of random host processes
    mem_limit: 6g
    volumes:
      - spleeter-models:/models
    # Local testing only
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  spleeter-models:
